docs: https://www.twilio.com/docs/iam/credentials/api
description: Twilio REST APIs authenticate with HTTP Basic (Account SID + Auth Token, or API Key SID + Secret, keys SK...) on every product; since 2026-04-06 OAuth
  2.0 is GA for Twilio Communications APIs (client credentials, RFC 6749 section 4.4) and since 2026-07-03 for organization APIs, which accept OAuth 2.0 only. The
  v2 token endpoint is https://oauth.twilio.com/v2/token (expires_in 3600); authorization-server metadata (RFC 8414) is served at https://oauth.twilio.com/.well-known/oauth-authorization-server
  with grant_types authorization_code, client_credentials, refresh_token and PKCE S256. Outbound webhooks can be authenticated to the customer endpoint with OAuth
  2.0 client credentials, Basic or Digest (webhook auth profiles).
oauth2:
  status: GA (2026-04-06 for Communications APIs; 2026-07-03 for Organization APIs)
  token_endpoint: https://oauth.twilio.com/v2/token
  authorization_endpoint: https://oauth.twilio.com/v2/authorize
  metadata: https://oauth.twilio.com/.well-known/oauth-authorization-server
  grant_types_supported:
  - authorization_code
  - client_credentials
  - refresh_token
  token_endpoint_auth_methods_supported:
  - client_secret_post
  - none
  code_challenge_methods_supported:
