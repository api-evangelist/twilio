description: Which cross-cutting / industry standards Twilio's REST APIs conform to, derived from the specs and conventions in this repo. Twilio
  authenticates with HTTP Basic (Account SID + Auth Token or API Key/Secret), not OAuth2/OIDC; its error body is a custom {code,message,more_info,status}
  envelope rather than RFC 9457 problem+json; and it does not document a general idempotency-key contract. It does publish a substantial security-compliance
  program (SOC 2, ISO 27001/17/18, PCI DSS, HIPAA, GDPR).
