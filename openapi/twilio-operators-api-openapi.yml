  schemas:
    OperatorContext:
      type: object
      description: 'Optionally specifies which contextual data sources (Memory, Knowledge) the operator can access during execution. Context objects will be passed in by the Intelligence Configuration Rule at runtime.


        **Note**: this simply gives the LLM access to these context objects – ultimately the LLM will determine whether to actually call for context at runtime.'
      properties:
        memory:
          type: object
          description: Defines whether the Operator has access to Memory (past conversational memories and profile traits).
          properties:
            enabled:
              type: boolean
              description: Set to true to allow access to Memory at runtime.
        knowledge:
          type: object
          description: Defines whether the Operator has access to organizational Knowledge Sources (e.g., policies, FAQs, scripts) at runtime.
          properties:
            enabled:
              type: boolean
              description: Set to true to allow access to Knowledge Sources at runtime.
    OperatorOutputSchema:
      type: object
      description: "Required for `JSON` output only. this will be set to a JSON Schema object describing the properties & data types of the response. Please see https://platform.openai.com/docs/guides/structured-outputs#supported-schemas \n\nWill include the following keywords:\n- `type` : Must be set to `object`\n- `properties`:  An object containing the property names and their data types you would like the LLM to return\n\nAdditional details on JSON output formatting:\n- The root level `type` of a JSON schema must be set to `object`\n- The following property data types are supported : `string`, `number`, `boolean`, `integer`, `object`, `array`, `anyOf`\n- Definitions with `$defs` / `$ref` are supported\n- Max 100 object properties and 10 levels of nesting are supported\n- Max 1000 enum values across all enum properties are supported\n- Notable JSON Schema keywords not supported include:\n  - For `strings`: `minLength`, `maxLength`\n  - For `objects`: `patternProperties`, `unevaluatedProperties`, `propertyNames`, `minProperties`, `maxProperties`\n  - For `arrays`: `unevaluatedItems`, `contains`, `minContains`, `maxContains`, `uniqueItems`\n- Structured Operator Results will be returned in the same order as the ordering of keys in the schema\n- In the event an Operator execution request is refused for safety reasons the Operator Result API response will include a new field called `refusal` to indicate that the LLM refused to fulfill the request\n- Twilio will automatically set `additionalProperties` to false and specify all provided fields as required (constraints of Structured Outputs). You don't need to pass these fields as part of your JSON schema. Twilio will automatically overwrite any user-provided values for these fields."
    OperatorOutputFormat:
      type: string
      description: 'The structure of the result returned by the Language Operator (specific to what the LLM returns, not the entirety of the Operator Result resource).


        Available values:

        - `TEXT`:  The Operator will return plaintext from the LLM.

        - `JSON`: the Operator will return a structured object with schema defined in `output_schema`

        - `CLASSIFICATION`: The Operator will return the determined classifier string.'
      enum:
      - TEXT
      - JSON
      - CLASSIFICATION
    OperatorTrainingExample:
      type: object
      required:
      - input
      - output
      properties:
        input:
          type: string
          description: A sample input text that demonstrates the type of content the Operator processes.
        output:
          type: string
          description: 'The expected output corresponding to the provided input example.

            This value must be consistent with the defined `output_format` and `output_schema` of the Operator.'
    LanguageOperator:
      description: A Language Operator resource.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OperatorTtid'
        displayName:
          type: string
          description: Display name of the Language Operator describing its purpose.
          minLength: 1
          maxLength: 128
        description:
          type: string
          description: Description of the Language Operator further explaining its purpose.
        version:
          type: integer
          readOnly: true
          description: Numeric Operator version. Automatically incremented with each update on the resource, used to ensure integrity when updating the Operator.
        author:
          $ref: '#/components/schemas/OperatorAuthorEnum'
        prompt:
          type: string
          description: 'The natural language instructions used by the operator to analyze the conversation.


            Within the prompt, users can reference parameters using the `{{parameters.[param_name]}}` syntax. Parameter values are provided to the Operator by the Intelligence Configuration Rule at runtime.


            **Note**: Prompts will only be exposed for Custom Operators (`author` = `SELF`). Twilio-authored Operators (`author` = `TWILIO`) will have their prompts omitted from the API.'
        outputFormat:
          $ref: '#/components/schemas/OperatorOutputFormat'
        outputSchema:
          $ref: '#/components/schemas/OperatorOutputSchema'
        trainingExamples:
          type: array
          description: 'An array of example input/output pairs used to illustrate the intended behavior of the Language Operator. These examples help guide the model''s understanding of expected input–output relationships and improve consistency during evaluation and testing.


            **Note**: Training examples will only be exposed for Custom Operators (`author` = `SELF`). Twilio-authored Operators (`author` = `TWILIO`) will have their training examples omitted from the API.'
          items:
            $ref: '#/components/schemas/OperatorTrainingExample'
        context:
          $ref: '#/components/schemas/OperatorContext'
        parameters:
          $ref: '#/components/schemas/OperatorParameters'
    OperatorParameters:
      type: object
      description: 'Defines the schema of the parameters that are provided when running the operator, including required and optional values that determine the operator''s behavior.

        The values of the parameters themselves are passed in by the attached Intelligence Configuration.'
      additionalProperties:
        $ref: '#/components/schemas/OperatorParameter'
    OperatorAuthorEnum:
      type: string
      readOnly: true
      description: "The creator and maintainer of the Language Operator. \n\nAvailable values:\n- `SELF` - Created and maintained by the customer (Custom Operator)\n- `TWILIO` - Created and maintained by Twilio (Twilio-Authored Operator)"
      enum:
      - SELF
      - TWILIO
    OperatorParameter:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: 'The data type of the parameter (e.g., STRING, INTEGER).

            Available values: STRING, INTEGER, NUMBER, BOOLEAN, KNOWLEDGE_BASE_AND_SOURCE_IDS


            KNOWLEDGE_BASE_AND_SOURCE_IDS is a special type of parameter that refers to a Memora Knowledge Source, prefixed with its Knowledge Base container. Support for KB type = plaintext only.

            During Intelligence Configuration creation, this parameter is linked to a specific Knowledge Source. The operator receives the resolved plaintext at runtime and injects it into the prompt.

            The value of this parameter is expected to be passed in the following format: knowledge_base_id:knowledge_source_id.'
          enum:
          - STRING
          - INTEGER
          - NUMBER
          - BOOLEAN
          - KNOWLEDGE_BASE_AND_SOURCE_IDS
        default:
          description: 'Default value to use in the prompt if no value is provided by the Intelligence Configuration.

            Note: knowledge_base_and_source_ids does not support the default attribute, but all other param types do allow for a default value.'
        required:
          type: boolean
          description: Whether this parameter must be set at Operator execution time. Defaults to false if not provided.
        description:
          type: string
          description: A human-readable description of the parameter.
    OperatorVersionStatus:
      type: string
      description: 'The lifecycle status of an Operator version.


        Available values:

        - `PREVIEW`: Available but restricted to internal/testing visibility. Normal execution.

        - `ACTIVE`: Available for normal use.

        - `DEPRECATED`: Still executes normally, but a Warn event is emitted via the Watch product lifecycle system. Customers should migrate to a newer version.

        - `RETIRED`: Hard failure on execution. An Error is logged in Watch. Customers must manually update their Intelligence Configuration to a valid version.'
      enum:
      - PREVIEW
      - ACTIVE
      - DEPRECATED
      - RETIRED
    OperatorTtid:
      type: string
      readOnly: true
      pattern: ^intelligence_operator_[0-7][0-9a-z]{25}$
      description: The unique identifier for the Language Operator. Assigned by Twilio (TTID).
      example: intelligence_operator_01k6fc25s7epm9qtk8rszbv3q5
  securitySchemes:
    basic_apikey_or_accountsid:
      scheme: basic
      type: http
      description: This API uses [basic authentication](https://www.twilio.com/docs/glossary/what-is-basic-authentication). Use an [API key](https://www.twilio.com/docs/iam/api-keys) as the username and the API key secret as the password. You can also use your account SID and auth token, but limit their use to local testing.
