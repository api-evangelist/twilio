  /v3/ControlPlane/Operators/{id}/Versions:
    x-twilio:
      pathType: list
    parameters:
    - name: id
      in: path
      required: true
      description: The unique identifier (TTID) of the Language Operator.
      schema:
        type: string
        readOnly: true
        pattern: ^intelligence_operator_[0-7][0-9a-z]{25}$
        description: The unique identifier for the Language Operator. Assigned by Twilio (TTID).
        example: intelligence_operator_01k6fc25s7epm9qtk8rszbv3q5
    get:
      tags:
      - Operators
      summary: Retrieve a list of Operator Versions
      description: Retrieve a paginated list of all versions for a given Language Operator.
      operationId: ListOperatorVersions
      parameters:
      - name: pageSize
        in: query
        description: The maximum number of resources to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: pageToken
        in: query
        description: Token for pagination
        required: false
        schema:
          type: string
      responses:
        200:
          description: A paginated list of Operator versions.
          content:
            application/json:
              schema:
                type: object
                description: Paginated list of Operator versions.
                required:
                - items
                - meta
                properties:
                  items:
                    type: array
                    description: List of Operator versions.
                    items:
                      type: object
                      required:
                      - version
                      - status
                      - dateCreated
                      properties:
                        version:
                          type: integer
                          description: The numeric version number.
                        status:
                          $ref: '#/components/schemas/OperatorVersionStatus'
                        dateCreated:
                          type: string
                          format: date-time
                          description: Timestamp of when this version was created.
                        dateDeprecated:
                          type: string
                          format: date-time
                          description: Timestamp of when this version was deprecated. Present when status is `DEPRECATED` or `RETIRED`.
                        retirementDate:
                          type: string
                          format: date-time
                          description: Scheduled retirement date for this version. Present when status is `DEPRECATED`.
                        dateRetired:
                          type: string
                          format: date-time
                          description: Timestamp of when this version was retired. Present when status is `RETIRED`.
                  meta:
                    type: object
                    properties:
                      key:
                        description: A key, sibling to the `meta` object that holds the actual list of resources
                        type: string
                      pageSize:
                        description: The actual number of resources returned in the response
