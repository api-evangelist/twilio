openapi: 3.2.0
info:
  title: Twilio Conversational Intelligence Operators API
  description: The Conversational Intelligence API includes resources to create and manage intelligence configurations, define and run language operators, and retrieve processed conversations and operator results.
  termsOfService: https://www.twilio.com/legal/tos
  contact:
    name: Twilio Support
    url: https://support.twilio.com
    email: support@twilio.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: v3
  x-twilio:
    apiStandards: v1.0
servers:
- url: https://intelligence.twilio.com
  description: Twilio Intelligence API
security:
- basic_apikey_or_accountsid: []
tags:
- name: Operators
  description: Define and manage language operators.
paths:
  /v3/ControlPlane/Operators:
    x-twilio:
      pathType: list
    get:
      tags:
      - Operators
      summary: Retrieve a list of Operators
      description: Retrieve a list of Operators for the account, including those not attached to an Intelligence Configuration. This request returns both Twilio-authored and custom language operators.
      operationId: ListOperators
      parameters:
      - name: pageSize
        in: query
        description: The maximum number of resources to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: pageToken
        in: query
        description: Token for pagination
        required: false
        schema:
          type: string
      responses:
        200:
          description: List of available Language Operators
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - meta
                properties:
                  items:
                    type: array
                    description: List of available Language Operators
                    items:
                      $ref: '#/components/schemas/LanguageOperator'
                  meta:
                    type: object
                    properties:
                      key:
                        description: A key, sibling to the `meta` object that holds the actual list of resources
                        type: string
                      pageSize:
                        description: The actual number of resources returned in the response
                        type: integer
                      previousToken:
                        type: string
                      nextToken:
                        type: string
                    required:
                    - key
                    - pageSize
              examples:
                listOperatorsResponse:
                  $ref: '#/components/examples/ListOperatorsResponseExample'
        429:
          description: Too Many requests (rate limit exceeded for request originating from public API)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
                  message:
                    description: A human readable error message
                    type: string
                  httpStatusCode:
                    description: HTTP response status code
                    type: integer
                    format: int32
                  userError:
                    description: Whether the error is a user error (true) or a system error (false)
                    type: boolean
                  params:
                    description: A map of parameters related to the error, for example, a `params.twilioErrorCodeUrl` might hold a URL or link to additional information
                    type: object
                    additionalProperties:
                      type: string
                required:
                - code
                - message
                - httpStatusCode
          headers:
            X-RateLimit-Limit:
              schema:
                type: string
            X-RateLimit-Remaining:
              schema:
                type: string
            X-RateLimit-Reset:
              schema:
                type: string
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
                  message:
                    description: A human readable error message
                    type: string
                  httpStatusCode:
                    description: HTTP response status code
                    type: integer
                    format: int32
                  userError:
                    description: Whether the error is a user error (true) or a system error (false)
                    type: boolean
                  params:
                    description: A map of parameters related to the error, for example, a `params.twilioErrorCodeUrl` might hold a URL or link to additional information
                    type: object
                    additionalProperties:
                      type: string
                required:
                - code
                - message
                - httpStatusCode
    post:
      tags:
      - Operators
      summary: Create an Operator
      description: Create a custom language operator. You can define a reusable, programmable conversational analysis task tailored to your business needs.
      operationId: CreateOperator
      requestBody:
        description: Create Language Operator request
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LanguageOperator'
              - required:
                - displayName
                - prompt
                - outputFormat
            examples:
              createOperatorRequest:
                $ref: '#/components/examples/CreateOrUpdateOperatorRequestExample'
      responses:
        201:
          description: Language Operator resource created.
          content:
            application/json:
              schema:
                description: A Language Operator resource.
                type: object
                properties:
                  id:
                    $ref: '#/components/schemas/OperatorTtid'
                  displayName:
                    type: string
                    description: Display name of the Language Operator describing its purpose.
                    minLength: 1
                    maxLength: 128
                  description:
                    type: string
                    description: Description of the Language Operator further explaining its purpose.
                  version:
                    type: integer
                    readOnly: true
                    description: Numeric Operator version. Automatically incremented with each update on the resource, used to ensure integrity when updating the Operator.
                  author:
                    $ref: '#/components/schemas/OperatorAuthorEnum'
                  prompt:
                    type: string
                    description: 'The natural language instructions used by the operator to analyze the conversation.


                      Within the prompt, users can reference parameters using the `{{parameters.[param_name]}}` syntax. Parameter values are provided to the Operator by the Intelligence Configuration Rule at runtime.


                      **Note**: Prompts will only be exposed for Custom Operators (`author` = `SELF`). Twilio-authored Operators (`author` = `TWILIO`) will have their prompts omitted from the API.'
                  outputFormat:
                    $ref: '#/components/schemas/OperatorOutputFormat'
                  outputSchema:
                    $ref: '#/components/schemas/OperatorOutputSchema'
                  trainingExamples:
                    type: array
                    description: 'An array of example input/output pairs used to illustrate the intended behavior of the Language Operator. These examples help guide the model''s understanding of expected input–output relationships and improve consistency during evaluation and testing.


                      **Note**: Training examples will only be exposed for Custom Operators (`author` = `SELF`). Twilio-authored Operators (`author` = `TWILIO`) will have their training examples omitted from the API.'
                    items:
                      $ref: '#/components/schemas/OperatorTrainingExample'
                  context:
                    $ref: '#/components/schemas/OperatorContext'
                  parameters:
                    $ref: '#/components/schemas/OperatorParameters'
              examples:
                createOperatorResponse:
                  $ref: '#/components/examples/LanguageOperatorExample'
          headers:
            ETag:
              description: The version for this resource, used for PUT requests in concert with the IF-MATCH header.
              schema:
                type: integer
                minimum: 1
                example: 1
        400:
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
                  message:
                    description: A human readable error message
                    type: string
                  httpStatusCode:
                    description: HTTP response status code
                    type: integer
                    format: int32
                  userError:
                    description: Whether the error is a user error (true) or a system error (false)
                    type: boolean
                  params:
                    description: A map of parameters related to the error, for example, a `params.twilioErrorCodeUrl` might hold a URL or link to additional information
                    type: object
                    additionalProperties:
                      type: string
                required:
                - code
                - message
                - httpStatusCode
        429:
          description: Too Many requests (rate limit exceeded for request originating from public API)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
                  message:
                    description: A human readable error message
                    type: string
                  httpStatusCode:
                    description: HTTP response status code
                    type: integer
                    format: int32
                  userError:
