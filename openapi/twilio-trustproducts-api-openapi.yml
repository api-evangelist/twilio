    CreateTrustProductRequest:
      type: object
      required:
      - FriendlyName
      - Email
      - PolicySid
      properties:
        FriendlyName:
          type: string
          description: The string that you assigned to describe the resource.
        Email:
          type: string
          description: The email address that will receive updates when the Customer-Profile resource changes status.
        PolicySid:
          type: string
