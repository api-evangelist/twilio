      - TrustProducts
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/trusthub.v1.trust_product'
          description: Created
      security:
      - accountSid_authToken: []
      operationId: CreateTrustProduct
      x-maturity:
      - GA
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateTrustProductRequest'
    get:
      description: Retrieve a list of all Customer-Profiles for an account.
      tags:
      - TrustProducts
      parameters:
      - name: Status
        in: query
        description: The verification status of the Customer-Profile resource.
        schema:
          type: string
          $ref: '#/components/schemas/trust_product_enum_status'
      - name: FriendlyName
        in: query
        description: The string that you assigned to describe the resource.
        schema:
          type: string
      - name: PolicySid
        in: query
        description: The unique string of a policy that is associated to the Customer-Profile resource.
        schema:
          type: string
          minLength: 34
          maxLength: 34
          pattern: ^RN[0-9a-fA-F]{32}$
      - name: PageSize
        in: query
        description: How many resources to return in each list page. The default is 50, and the maximum is 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - name: Page
        in: query
        description: The page index. This value is simply for client state.
        schema:
          type: integer
          minimum: 0
      - name: PageToken
        in: query
        description: The page token. This is provided by the API.
        schema:
          type: string
