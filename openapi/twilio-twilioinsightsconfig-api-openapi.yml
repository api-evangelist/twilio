openapi: 3.2.0
info:
  title: Twilio - Insights Twilio Insights Config API
  description: 'The Twilio Insights v3 API provides semantic query access to Conversations

    analytics data. Resources include synchronous Query, Metadata, and asynchronous

    QueryJobs for long-running queries.'
  termsOfService: https://www.twilio.com/legal/tos
  contact:
    name: Twilio Support
    url: https://support.twilio.com
    email: support@twilio.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.1.0
  x-twilio:
    apiStandards: v1.0
servers:
- url: https://insights.twilio.com
security:
- basic_apikey_or_accountsid: []
tags:
- name: TwilioInsightsConfig
  description: Twilio Insights Config API for custom measure field mapping registration.
paths:
  /v3/ControlPlane/ConversationInsights/CustomFieldMappings:
    servers:
    - url: https://insights.twilio.com
    post:
      summary: Register a custom measure field mapping
      description: 'Registers a custom field for an account under a category, sourced from an

        upstream entity — selected via the `entityMetadata.sourceType`

        discriminator, which determines the required shape of `entityMetadata`.

        Only the `MEASURE` category is supported for now.


        For sources with a resolvable field-path concept, validates that

        `entityMetadata.field` resolves on the entity''s latest active version by

        calling that source''s own resolution API (the Intelligence fetch-operator

        API for `sourceType: INTELLIGENCE_OPERATOR`), then performs an idempotent

        upsert keyed on (accountSid, category, name).

        `entityMetadata.sourceType` plus that variant''s own identity field

        (`operatorId` for `INTELLIGENCE_OPERATOR`) must match the existing

        registration''s owner for the upsert to succeed — a mismatch returns

        `409`. Enforces the per-account, per-category capacity limit.'
      tags:
      - TwilioInsightsConfig
      operationId: CreateCustomFieldMapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldMappingRequest'
            examples:
              measure_from_intelligence_operator:
                summary: Register a custom measure sourced from an Intelligence operator
                value:
                  category: MEASURE
                  name: LeadScore
                  description: Lead quality score derived from sentiment analysis
                  entityMetadata:
                    sourceType: INTELLIGENCE_OPERATOR
                    operatorId: OPxxxx
                    operatorName: Sentiment Analysis
                    field: leadScore
      responses:
        '200':
          description: The `name` was already registered for this operator and was updated in-place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldMappingResponse'
        '201':
          description: Newly registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldMappingResponse'
        400:
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
                  message:
                    description: A human readable error message
                    type: string
                  httpStatusCode:
                    description: HTTP response status code
                    type: integer
                    format: int32
                  userError:
                    description: Whether the error is a user error (true) or a system error (false)
                    type: boolean
                  params:
                    description: A map of parameters related to the error, for example, a `params.twilioErrorCodeUrl` might hold a URL or link to additional information
                    type: object
                    additionalProperties:
                      type: string
                required:
                - code
                - message
                - httpStatusCode
        401:
