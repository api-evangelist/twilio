components:
  schemas:
    SourceType:
      type: string
      description: 'The kind of upstream entity that sources this field. The value names the

        entity type itself, so the identifier carried in `entityMetadata` is

        unambiguous without a lookup (`INTELLIGENCE_OPERATOR` carries an

        `operatorId`).


        Adding a new upstream means adding a value here plus its own

        `entityMetadata` variant — the request shape is unchanged.

        '
      enum:
      - INTELLIGENCE_OPERATOR
    CustomFieldMappingsList:
      type: object
      description: All custom field mappings registered for an account.
      required:
      - mappings
      properties:
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldMappingResponse'
    EntityMetadata:
      description: 'Reference to the upstream entity that sources this field. Shape is

        selected by the `sourceType` discriminator and owned by that upstream, not

        by this API — adding a new upstream means adding a variant here, not

        changing the request shape.


        Every variant carries `sourceType` via `EntityMetadataBase`, so a client

        that does not recognise a newly added variant can still deserialize the

        common fields rather than failing outright.


        The owner check for idempotent upserts is scoped to `sourceType` plus that

        variant''s own identity field (`operatorId` for `INTELLIGENCE_OPERATOR`); a

        mismatch against an existing registration''s owner returns `409`.

        '
      oneOf:
      - $ref: '#/components/schemas/IntelligenceOperatorEntityMetadata'
      discriminator:
        propertyName: sourceType
        mapping:
          INTELLIGENCE_OPERATOR: '#/components/schemas/IntelligenceOperatorEntityMetadata'
    IntelligenceOperatorEntityMetadata:
      description: 'Entity reference for a custom field sourced from a Conversational

        Intelligence operator. `field` is required — Intelligence is the source of

        truth for resolving it against the operator''s output schema.

        '
      type: object
      properties:
        sourceType:
          $ref: '#/components/schemas/SourceType'
        operatorId:
          type: string
          description: 'The Intelligence operator ID. Part of the owner check for

            idempotent upserts — a mismatch against the existing

            registration''s `(sourceType, operatorId)` returns `409`.

            '
          example: OPxxxx
        operatorName:
          type: string
          description: 'Optional, display-only name of the operator as supplied at

            registration time. Not part of any uniqueness or validation logic.

            '
          example: Sentiment Analysis
        field:
          type: string
          description: 'Annotation fieldPath key; generic identifier that determines the

            output-schema field. Resolved against the operator identified by

            `operatorId`.

            '
          pattern: ^[A-Za-z0-9_.]+$
          example: leadScore
      required:
      - field
      - operatorId
      - sourceType
    CategoryCapacity:
      type: object
      description: 'Slots consumed and remaining for the measure category. Empty when not

        applicable for the account.

        '
      properties:
        consumed:
          type: integer
          description: Number of custom field mapping slots already registered.
          example: 1
        remaining:
          type: integer
          description: Number of custom field mapping slots still available.
          example: 2
    MappingCategory:
      type: string
      description: The type of field being registered. Only `MEASURE` is supported.
      enum:
      - MEASURE
    CustomFieldMappingResponse:
      type: object
      description: A registered custom field mapping.
      required:
      - category
      - name
      - entityMetadata
      properties:
        id:
          type: string
          description: TTID for conversation insights custom field mapping
          example: convinsights_mapping_01m31967b7em08vh1pqgbam3mj
        category:
          $ref: '#/components/schemas/MappingCategory'
        name:
          type: string
        description:
          type: string
          description: 'Optional, free-text description supplied at registration time.

            Display-only — not part of any uniqueness check.

            '
          maxLength: 150
          example: Lead quality score derived from sentiment analysis
        entityMetadata:
          $ref: '#/components/schemas/EntityMetadata'
        createdAt:
          type: string
          format: date-time
          description: When the mapping was registered.
          example: '2026-08-13T14:30:00Z'
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the mapping was last materially modified in-place. Null until the first update-in-place.
          example: '2026-08-13T14:30:00Z'
    CustomFieldMappingRequest:
      type: object
      description: 'Registration payload for a single custom field sourced from an upstream

        entity. The target account is supplied via the I-Twilio-Auth-Account

        header, not this body.

        '
      required:
      - category
      - name
      - entityMetadata
      properties:
        category:
          $ref: '#/components/schemas/MappingCategory'
        name:
          type: string
          description: 'Customer-facing name for the field; becomes the ClickHouse Map key and

            the platform field alias. Unique per account across every

            `sourceType` — the Map key namespace is account-global.

            '
          pattern: ^[A-Za-z0-9_]+$
          example: LeadScore
        description:
          type: string
          description: 'Optional, free-text description of this custom field mapping.

            Display-only — not part of any uniqueness check.

            '
          maxLength: 150
          example: Lead quality score derived from sentiment analysis
        entityMetadata:
          $ref: '#/components/schemas/EntityMetadata'
    CustomFieldCapacity:
      type: object
      description: 'Custom field mapping slot capacity for the account. Only the `measure`

        category is supported for now; it is an empty object when custom

        measures are not applicable for the account.

        '
      properties:
        measure:
          $ref: '#/components/schemas/CategoryCapacity'
  headers:
    X-Rate-Limit-Limit:
      schema:
        type: string
    X-Rate-Limit-Remaining:
      schema:
        type: string
    X-Rate-Limit-Config:
      schema:
        type: string
  securitySchemes:
    basic_apikey_or_accountsid:
      scheme: basic
      type: http
      description: This API uses [basic authentication](https://www.twilio.com/docs/glossary/what-is-basic-authentication). Use an [API key](https://www.twilio.com/docs/iam/api-keys) as the username and the API key secret as the password. You can also use your account SID and auth token, but limit their use to local testing.
