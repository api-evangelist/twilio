      - type
      pathType: list
    get:
      description: ''
      tags:
      - Credentials
      parameters:
      - name: PageSize
        in: query
        description: How many resources to return in each list page. The default is 50, and the maximum is 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - name: Page
        in: query
        description: The page index. This value is simply for client state.
        schema:
          type: integer
          minimum: 0
      - name: PageToken
        in: query
        description: The page token. This is provided by the API.
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCredentialResponse_2'
          description: OK
      security:
      - accountSid_authToken: []
      operationId: ListCredential
      x-maturity:
      - GA
    post:
      description: ''
      tags:
      - Credentials
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ip_messaging.v2.credential'
          description: Created
      security:
      - accountSid_authToken: []
      operationId: CreateCredential
      x-maturity:
      - GA
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest_2'
  /v2/Credentials/{Sid}:
    servers:
    - url: https://ip-messaging.twilio.com
    description: 'TODO: Resource-level docs'
    x-twilio:
      defaultOutputProperties:
      - sid
      - friendly_name
      - type
      pathType: instance
    get:
      description: ''
