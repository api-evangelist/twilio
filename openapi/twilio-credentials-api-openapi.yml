openapi: 3.0.1
info:
  title: Twilio - Accounts A2p Credentials API
  description: This is the public Twilio REST API.
  termsOfService: https://www.twilio.com/legal/tos
  contact:
    name: Twilio Support
    url: https://support.twilio.com
    email: support@twilio.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.52.0
servers:
- url: https://accounts.twilio.com
tags:
- name: Credentials
paths:
  /v1/Credentials/AWS:
    servers:
    - url: https://accounts.twilio.com
    description: User provided AWS keys
    x-twilio:
      defaultOutputProperties:
      - sid
      - friendly_name
      - date_created
      pathType: list
      parent: /Credentials
    get:
      description: Retrieves a collection of AWS Credentials belonging to the account used to make the request
      tags:
      - Credentials
      parameters:
      - name: PageSize
        in: query
        description: How many resources to return in each list page. The default is 50, and the maximum is 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - name: Page
        in: query
        description: The page index. This value is simply for client state.
        schema:
          type: integer
          minimum: 0
      - name: PageToken
        in: query
        description: The page token. This is provided by the API.
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCredentialAwsResponse'
          description: OK
      security:
      - accountSid_authToken: []
      operationId: ListCredentialAws
      x-maturity:
      - GA
    post:
      description: Create a new AWS Credential
      tags:
      - Credentials
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accounts.v1.credential.credential_aws'
          description: Created
      security:
      - accountSid_authToken: []
      operationId: CreateCredentialAws
      x-maturity:
      - GA
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCredentialAwsRequest'
  /v1/Credentials/AWS/{Sid}:
    servers:
    - url: https://accounts.twilio.com
    description: User provided AWS keys
    x-twilio:
      defaultOutputProperties:
      - sid
      - friendly_name
      - date_created
      pathType: instance
      parent: /Credentials
    get:
      description: Fetch the AWS credentials specified by the provided Credential Sid
      tags:
      - Credentials
      parameters:
      - name: Sid
        in: path
        description: The Twilio-provided string that uniquely identifies the AWS resource to fetch.
        schema:
          type: string
          minLength: 34
          maxLength: 34
          pattern: ^CR[0-9a-fA-F]{32}$
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accounts.v1.credential.credential_aws'
          description: OK
      security:
      - accountSid_authToken: []
      operationId: FetchCredentialAws
      x-maturity:
      - GA
    post:
      description: Modify the properties of a given Account
      tags:
      - Credentials
      parameters:
      - name: Sid
        in: path
        description: The Twilio-provided string that uniquely identifies the AWS resource to update.
        schema:
          type: string
          minLength: 34
          maxLength: 34
          pattern: ^CR[0-9a-fA-F]{32}$
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accounts.v1.credential.credential_aws'
          description: OK
      security:
      - accountSid_authToken: []
      operationId: UpdateCredentialAws
      x-maturity:
      - GA
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateCredentialAwsRequest'
    delete:
      description: Delete a Credential from your account
      tags:
      - Credentials
      parameters:
      - name: Sid
        in: path
        description: The Twilio-provided string that uniquely identifies the AWS resource to delete.
        schema:
          type: string
          minLength: 34
          maxLength: 34
          pattern: ^CR[0-9a-fA-F]{32}$
        required: true
      responses:
        '204':
          description: The resource was deleted successfully.
      security:
      - accountSid_authToken: []
      operationId: DeleteCredentialAws
      x-maturity:
      - GA
  /v1/Credentials/PublicKeys:
    servers:
    - url: https://accounts.twilio.com
    description: User provided public keys
    x-twilio:
      defaultOutputProperties:
      - sid
      - friendly_name
      - date_created
      pathType: list
      parent: /Credentials
      mountName: public_key
    get:
      description: Retrieves a collection of Public Key Credentials belonging to the account used to make the request
      tags:
      - Credentials
      parameters:
      - name: PageSize
        in: query
        description: How many resources to return in each list page. The default is 50, and the maximum is 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - name: Page
        in: query
        description: The page index. This value is simply for client state.
        schema:
          type: integer
          minimum: 0
      - name: PageToken
        in: query
        description: The page token. This is provided by the API.
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCredentialPublicKeyResponse'
          description: OK
      security:
      - accountSid_authToken: []
      operationId: ListCredentialPublicKey
      x-maturity:
      - GA
    post:
      description: Create a new Public Key Credential
      tags:
      - Credentials
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accounts.v1.credential.credential_public_key'
          description: Created
      security:
      - accountSid_authToken: []
      operationId: CreateCredentialPublicKey
      x-maturity:
      - GA
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCredentialPublicKeyRequest'
  /v1/Credentials/PublicKeys/{Sid}:
    servers:
    - url: https://accounts.twilio.com
    description: User provided public keys
    x-twilio:
      defaultOutputProperties:
      - sid
      - friendly_name
      - date_created
      pathType: instance
      parent: /Credentials
      mountName: public_key
    get:
      description: Fetch the public key specified by the provided Credential Sid
      tags:
      - Credentials
      parameters:
      - name: Sid
        in: path
        description: The Twilio-provided string that uniquely identifies the PublicKey resource to fetch.
        schema:
          type: string
          minLength: 34
          maxLength: 34
          pattern: ^CR[0-9a-fA-F]{32}$
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accounts.v1.credential.credential_public_key'
          description: OK
      security:
      - accountSid_authToken: []
      operationId: FetchCredentialPublicKey
      x-maturity:
      - GA
    post:
      description: Modify the properties of a given Account
      tags:
      - Credentials
      parameters:
      - name: Sid
        in: path
        description: The Twilio-provided string that uniquely identifies the PublicKey resource to update.
        schema:
          type: string
          minLength: 34
          maxLength: 34
          pattern: ^CR[0-9a-fA-F]{32}$
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accounts.v1.credential.credential_public_key'
          description: OK
      security:
      - accountSid_authToken: []
      operationId: UpdateCredentialPublicKey
      x-maturity:
      - GA
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateCredentialPublicKeyRequest'
    delete:
      description: Delete a Credential from your account
      tags:
      - Credentials
      parameters:
      - name: Sid
        in: path
        description: The Twilio-provided string that uniquely identifies the PublicKey resource to delete.
        schema:
          type: string
          minLength: 34
          maxLength: 34
          pattern: ^CR[0-9a-fA-F]{32}$
        required: true
      responses:
        '204':
          description: The resource was deleted successfully.
      security:
      - accountSid_authToken: []
      operationId: DeleteCredentialPublicKey
      x-maturity:
      - GA
  /v1/Credentials:
    servers:
    - url: https://conversations.twilio.com
    description: A Credential resource represents a push notification credential.
    x-twilio:
      defaultOutputProperties:
      - sid
      - friendly_name
      - type
      pathType: list
    post:
      description: Add a new push notification credential to your account
      tags:
      - Credentials
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conversations.v1.credential'
          description: Created
      security:
      - accountSid_authToken: []
      operationId: CreateCredential
      x-maturity:
      - GA
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
    get:
      description: Retrieve a list of all push notification credentials on your account
      tags:
      - Credentials
      parameters:
      - name: PageSize
        in: query
        description: How many resources to return in each list page. The default is 50, and the maximum is 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - name: Page
        in: query
        description: The page index. This value is simply for client state.
        schema:
          type: integer
          minimum: 0
      - name: PageToken
        in: query
        description: The page token. This is provided by the API.
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCredentialResponse'
          description: OK
      security:
      - accountSid_authToken: []
      operationId: ListCredential
      x-maturity:
      - GA
  /v1/Credentials/{Sid}:
    servers:
    - url: https://conversations.twilio.com
    description: A Credential resource represents a push notification credential.
    x-twilio:
      defaultOutputProperties:
      - sid
      - friendly_name
      - type
      pathType: instance
    post:
      description: Update an existing push notification credential on your account
      tags:
      - Credentials
      parameters:
      - name: Sid
        in: path
        description: A 34 character string that uniquely identifies this resource.
        schema:
          type: string
          minLength: 34
          maxLength: 34
          pattern: ^CR[0-9a-fA-F]{32}$
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conversations.v1.credential'
          description: OK
      security:
      - accountSid_authToken: []
      operationId: UpdateCredential
      x-maturity:
      - GA
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateCredentialRequest'
    delete:
      description: Remove a push notification credential from your account
      tags:
      - Credentials
      parameters:
      - name: Sid
        in: path
        description: A 34 character string that uniquely identifies this resource.
        schema:
          type: string
          minLength: 34
          maxLength: 34
          pattern: ^CR[0-9a-fA-F]{32}$
        required: true
      responses:
        '204':
          description: The resource was deleted successfully.
      security:
      - accountSid_authToken: []
      operationId: DeleteCredential
      x-maturity:
      - GA
    get:
      description: Fetch a push notification credential from your account
      tags:
      - Credentials
      parameters:
      - name: Sid
        in: path
        description: A 34 character string that uniquely identifies this resource.
        schema:
          type: string
          minLength: 34
          maxLength: 34
          pattern: ^CR[0-9a-fA-F]{32}$
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conversations.v1.credential'
          description: OK
      security:
      - accountSid_authToken: []
      operationId: FetchCredential
      x-maturity:
      - GA
  /v2/Credentials:
    servers:
    - url: https://ip-messaging.twilio.com
    description: 'TODO: Resource-level docs'
