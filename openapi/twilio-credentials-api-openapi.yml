          pattern: ^CR[0-9a-fA-F]{32}$
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ip_messaging.v2.credential'
          description: OK
      security:
      - accountSid_authToken: []
      operationId: FetchCredential
      x-maturity:
      - GA
    post:
      description: ''
      tags:
