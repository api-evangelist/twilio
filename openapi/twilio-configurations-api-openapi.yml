components:
  schemas:
    Rule:
      type: object
      required:
      - id
      - operators
      - triggers
      - actions
      properties:
        id:
          type: string
          description: The unique identifier for the Rule. Assigned by Twilio (TTID).
        operators:
          type: array
          items:
            $ref: '#/components/schemas/Operator'
          maxItems: 5
          description: List of Operators to be executed by the Rule. Maximum of five (5) Operators allowed per Rule.
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/Trigger'
          maxItems: 1
          description: List of Triggers that determine when to activate the Rule. Maximum of one (1) Trigger allowed per Rule.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
          maxItems: 2
          description: List of Actions to be performed after the Rule is triggered. Maximum of two (2) Actions allowed per Rule.
        context:
          $ref: '#/components/schemas/Context'
    Action:
      type: object
      required:
      - type
      - method
      - url
      properties:
        type:
          type: string
          enum:
          - WEBHOOK
          description: 'The type of Action to be performed after the Rule is triggered. Supported Actions are:

            - `WEBHOOK`: A webhook Action sends an HTTP request to a specified URL with Rule execution results.

            '
        method:
          type: string
          enum:
          - POST
          description: The HTTP method to be used when performing the Action. Must be set to `POST`.
        url:
          type: string
          format: uri
          description: The URL endpoint where the Action will send the HTTP request containing the Rule execution results.
    RuleUpdateRequestPayload:
      type: object
      required:
      - operators
      - actions
      properties:
        id:
          type: string
          description: 'Optional field used when updating an existing Rule within an Intelligence Configuration.

            When provided, the Rule with this `id` is updated; when omitted, a new Rule is created.

            '
        operators:
          type: array
          description: List of Operators to be executed by the Rule. Minimum of one (1) and maximum of five (5) Operators allowed per Rule.
          items:
            $ref: '#/components/schemas/Operator'
          minItems: 1
          maxItems: 5
        triggers:
          type: array
          description: List of Triggers that determine when to activate the Rule. Maximum of one (1) Trigger allowed per Rule.
          items:
            $ref: '#/components/schemas/Trigger'
          maxItems: 1
        actions:
          type: array
          description: List of Actions to be performed after the Rule is triggered. Maximum of two (2) Actions allowed per Rule.
          items:
            $ref: '#/components/schemas/Action'
          maxItems: 2
        context:
          $ref: '#/components/schemas/Context'
    Context:
      type: object
      description: Controls what additional customer and enterprise context is made available to Language Operators when this Rule executes.
      properties:
        memory:
          type: object
          description: Configuration for passing Memory as context to Operators in this Rule (available only for Memory–enabled accounts).
          properties:
            enabled:
              type: boolean
              description: 'When set to `true`, allows this Intelligence Configuration Rule to pass the Profile

                into attached Language Operators. The profile is only passed to Language Operators

                that have Memory as a context source enabled.

                '
        knowledge:
          type: object
          description: Configuration for passing Enterprise Knowledge as context to Operators in this Rule (available only for Enterprise Knowledge–enabled accounts).
          properties:
            bases:
              type: array
              description: 'Specifies the Knowledge Base(s) and corresponding Source(s) to pass to Language

                Operators in this Rule as context. Only applied to Language Operators that have

                Knowledge as a context source enabled.

                '
              items:
                type: string
              minItems: 1
          required:
          - bases
    Operator:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: The unique identifier for the Language Operator to be executed by the Rule. Assigned by Twilio (TTID).
        version:
          type: integer
          description: 'The specific version of the Language Operator to execute. When provided, the Rule will use this exact version of the Operator.

            When omitted, the latest active version of the Operator is used at execution time.

            '
        parameters:
          type: object
          description: 'Key-value mapping for parameters defined as part of the Operator schema. The key and value passed by the Rule must match the name and data type of the parameter defined in the Operator, respectively.

            These parameters will customize the behavior of the Operator when executed by the Rule via runtime substitution into the prompt.

            Note: For parameters of type `knowledge_base_and_source_ids`, the value must be passed in the following format: `knowledge_base_id:knowledge_source_id`.

            '
    RuleCreationRequestPayload:
      type: object
      required:
      - operators
      - actions
      properties:
        operators:
          type: array
          description: List of Operators to be executed by the Rule. Minimum of one (1) and maximum of five (5) Operators allowed per Rule.
          items:
            $ref: '#/components/schemas/Operator'
          minItems: 1
          maxItems: 5
        triggers:
          type: array
          description: List of Triggers that determine when to activate the Rule. Maximum of one (1) Trigger allowed per Rule.
          items:
            $ref: '#/components/schemas/Trigger'
          maxItems: 1
        actions:
          type: array
          description: List of Actions to be performed after the Rule is triggered. Maximum of two (2) Actions allowed per Rule.
          items:
            $ref: '#/components/schemas/Action'
          maxItems: 2
        context:
          $ref: '#/components/schemas/Context'
    Trigger:
      type: object
      required:
      - 'on'
      properties:
        'on':
          type: string
          description: 'The conversational lifecycle event that will activate execution of the Rule.

            Available values are:

            - `COMMUNICATION`: Trigger the Rule on each communication within the Conversation.

            - `CONVERSATION_END`: Trigger the Rule when the Conversation moves to the `closed` state

            - `CONVERSATION_INACTIVE`: Trigger the Rule when the Conversation moves to `inactive` state

            '
          enum:
          - COMMUNICATION
          - CONVERSATION_END
          - CONVERSATION_INACTIVE
        parameters:
          type: object
          description: Additional configuration to modify Trigger behavior. Only applies to certain Trigger types.
          properties:
            count:
              type: integer
              description: 'When `on` is set to `COMMUNICATION`, this value controls how often the Rule should

                run. A value of `1` executes the Rule for every communication event. Higher values

                delay execution until the specified number of communications have occurred since the last execution.

                '
              minimum: 1
              maximum: 20
              default: 1
    IntelligenceConfiguration:
      type: object
      description: "An Intelligence Configuration defines how and when Language Operators execute for a given conversation.\n\nTo activate an Intelligence Configuration and trigger Operator execution, two conditions must be met:\n1. The Intelligence Configuration must include at least one Rule.\n2. The Intelligence Configuration must be attached to a Conversations Configuration via the Conversations API.\n   Conversation traffic received by that Conversations Configuration determines when Rules are evaluated\n   and executed.\n\nAn Intelligence Configuration that has no Rules or is not attached to a Conversations Configuration will not execute.\n"
      required:
      - accountId
      - id
      - displayName
      - version
      - rules
      - dateCreated
      - dateUpdated
      properties:
        accountId:
          type: string
          example: REDACTED_TWILIO_ACCOUNT_SID
          x-jvm-type: com.twilio.sids.AccountSid
          description: The ID of the Account that created the Intelligence Configuration.
        id:
          type: string
          description: The unique identifier for the Intelligence Configuration. Assigned by Twilio (TTID).
        displayName:
          type: string
          description: The display name of the Intelligence Configuration describing its purpose.
          minLength: 1
          maxLength: 128
        description:
          type: string
          description: The description of the Intelligence Configuration further explaining its purpose.
        version:
          type: integer
          description: The numeric version of the Intelligence Configuration. Automatically incremented with each update on the resource, used to ensure integrity when updating the Configuration.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
          maxItems: 5
          description: 'List of Intelligence Configuration Rules that govern when and how Language Operators run.

            Each Rule represents a bundle of Operators, Triggers, Context, and Actions to be executed by

            the Intelligence Configuration on a Conversation. A maximum of five (5) Rules are allowed per

            Intelligence Configuration.

            '
        dateCreated:
          description: Timestamp of when the Intelligence Configuration was created.
          type: string
          format: date-time
        dateUpdated:
          description: Timestamp of when the Intelligence Configuration was last updated.
          type: string
          format: date-time
