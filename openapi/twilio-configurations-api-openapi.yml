openapi: 3.2.0
info:
  title: Twilio Conversational Intelligence Configurations API
  description: The Conversational Intelligence API includes resources to create and manage intelligence configurations, define and run language operators, and retrieve processed conversations and operator results.
  termsOfService: https://www.twilio.com/legal/tos
  contact:
    name: Twilio Support
    url: https://support.twilio.com
    email: support@twilio.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: v3
  x-twilio:
    apiStandards: v1.0
servers:
- url: https://intelligence.twilio.com
  description: Twilio Intelligence API
security:
- basic_apikey_or_accountsid: []
tags:
- name: Configurations
  description: Define and manage intelligence configuration.
paths:
  /v3/ControlPlane/Configurations:
    x-twilio:
      pathType: list
    post:
      summary: Create an Intelligence Configuration
      tags:
      - Configurations
      security:
      - basic_apikey_or_accountsid: []
      operationId: CreateConfiguration
      description: 'Create an Intelligence Configuration to control how and when language operators analyze conversations.


        You must include the `rules` field in the request. You can pass an empty array (`"rules": []`), but an Intelligence Configuration with an empty `rules` array doesn''t execute any language operators. To add rules later, make a `PUT /v3/ControlPlane/Configurations/{id}` request.


        After creating an Intelligence Configuration, you must attach it to a Conversations Configuration by using the Conversations API.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request body for creating a new Intelligence Configuration.
              properties:
                displayName:
                  type: string
                  description: The display name of the Intelligence Configuration describing its purpose.
                  minLength: 1
                  maxLength: 128
                description:
                  type: string
                  description: The description of the Intelligence Configuration further explaining its purpose.
                rules:
                  description: 'List of Intelligence Configuration Rules that govern when and how Language Operators run.

                    Each Rule represents a bundle of Operators, Triggers, Context, and Actions to be executed by

                    the Intelligence Configuration on a Conversation. A maximum of five (5) Rules are allowed per

                    Intelligence Configuration.


                    To create an Intelligence Configuration without any Rules configured yet, pass an empty array

                    (`"rules": []`). The Configuration will not execute any Language Operators until at least one Rule

                    has been added.

                    '
                  type: array
                  items:
                    $ref: '#/components/schemas/RuleCreationRequestPayload'
                  maxItems: 5
              required:
              - displayName
              - rules
            examples:
              createConfigurationRequest:
                $ref: '#/components/examples/CreateConfigurationRequestExample'
      responses:
        '201':
          description: Intelligence Configuration resource created.
          content:
            application/json:
              schema:
                type: object
                description: "An Intelligence Configuration defines how and when Language Operators execute for a given conversation.\n\nTo activate an Intelligence Configuration and trigger Operator execution, two conditions must be met:\n1. The Intelligence Configuration must include at least one Rule.\n2. The Intelligence Configuration must be attached to a Conversations Configuration via the Conversations API.\n   Conversation traffic received by that Conversations Configuration determines when Rules are evaluated\n   and executed.\n\nAn Intelligence Configuration that has no Rules or is not attached to a Conversations Configuration will not execute.\n"
                required:
                - accountId
                - id
                - displayName
                - version
                - rules
                - dateCreated
                - dateUpdated
                properties:
                  accountId:
                    type: string
                    example: REDACTED_TWILIO_ACCOUNT_SID
                    x-jvm-type: com.twilio.sids.AccountSid
                    description: The ID of the Account that created the Intelligence Configuration.
                  id:
                    type: string
                    description: The unique identifier for the Intelligence Configuration. Assigned by Twilio (TTID).
                  displayName:
                    type: string
                    description: The display name of the Intelligence Configuration describing its purpose.
                    minLength: 1
                    maxLength: 128
                  description:
                    type: string
                    description: The description of the Intelligence Configuration further explaining its purpose.
                  version:
                    type: integer
                    description: The numeric version of the Intelligence Configuration. Automatically incremented with each update on the resource, used to ensure integrity when updating the Configuration.
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/Rule'
                    maxItems: 5
                    description: 'List of Intelligence Configuration Rules that govern when and how Language Operators run.

                      Each Rule represents a bundle of Operators, Triggers, Context, and Actions to be executed by

                      the Intelligence Configuration on a Conversation. A maximum of five (5) Rules are allowed per

                      Intelligence Configuration.

                      '
                  dateCreated:
                    description: Timestamp of when the Intelligence Configuration was created.
                    type: string
                    format: date-time
                  dateUpdated:
                    description: Timestamp of when the Intelligence Configuration was last updated.
                    type: string
                    format: date-time
              examples:
                createConfigurationResponse:
                  $ref: '#/components/examples/IntelligenceConfigurationExample'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
                  message:
                    description: A human readable error message
                    type: string
                  httpStatusCode:
                    description: HTTP response status code
                    type: integer
                    format: int32
                  userError:
                    description: Whether the error is a user error (true) or a system error (false)
                    type: boolean
                  params:
                    description: A map of parameters related to the error, for example, a `params.twilioErrorCodeUrl` might hold a URL or link to additional information
                    type: object
                    additionalProperties:
                      type: string
                required:
                - code
                - message
                - httpStatusCode
        '429':
          description: Too Many requests (rate limit exceeded for request originating from public API)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
                  message:
                    description: A human readable error message
                    type: string
                  httpStatusCode:
                    description: HTTP response status code
                    type: integer
                    format: int32
                  userError:
                    description: Whether the error is a user error (true) or a system error (false)
                    type: boolean
                  params:
                    description: A map of parameters related to the error, for example, a `params.twilioErrorCodeUrl` might hold a URL or link to additional information
                    type: object
                    additionalProperties:
                      type: string
                required:
                - code
                - message
                - httpStatusCode
          headers:
            X-RateLimit-Limit:
              schema:
                type: string
            X-RateLimit-Remaining:
              schema:
                type: string
            X-RateLimit-Reset:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
                  message:
                    description: A human readable error message
                    type: string
                  httpStatusCode:
                    description: HTTP response status code
                    type: integer
                    format: int32
                  userError:
                    description: Whether the error is a user error (true) or a system error (false)
                    type: boolean
                  params:
                    description: A map of parameters related to the error, for example, a `params.twilioErrorCodeUrl` might hold a URL or link to additional information
                    type: object
                    additionalProperties:
                      type: string
                required:
                - code
                - message
                - httpStatusCode
