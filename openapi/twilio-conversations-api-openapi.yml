        in: query
        description: Filter by Conversations created before this timestamp. The maximum allowed time range between `createdAtBefore` and `createdAtAfter` is 31 days.
        required: false
        schema:
          type: string
          format: date-time
      - name: createdAtAfter
        in: query
        description: Filter by Conversations created after this timestamp. The maximum allowed time range between `createdAtBefore` and `createdAtAfter` is 31 days.
        required: false
