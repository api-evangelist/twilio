          type: string
          description: The status of the Conversation.
          enum:
          - ACTIVE
          - INACTIVE
          - CLOSED
      - name: channelId
        in: query
        description: Filters Conversations by the underlying channel resource ID, such as a Call ID or Message ID.
        required: false
