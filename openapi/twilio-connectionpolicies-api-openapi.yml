    get:
      description: ''
      tags:
      - ConnectionPolicies
      parameters:
      - name: ConnectionPolicySid
        in: path
        description: The SID of the Connection Policy from which to read the Targets.
        schema:
          type: string
          minLength: 34
          maxLength: 34
          pattern: ^NY[0-9a-fA-F]{32}$
        required: true
      - name: PageSize
