openapi: 3.0.1
info:
  title: Twilio - Accounts A2p ConnectionPolicies API
  description: This is the public Twilio REST API.
  termsOfService: https://www.twilio.com/legal/tos
  contact:
    name: Twilio Support
    url: https://support.twilio.com
    email: support@twilio.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.52.0
servers:
- url: https://accounts.twilio.com
tags:
- name: ConnectionPolicies
paths:
  /v1/ConnectionPolicies:
    servers:
    - url: https://voice.twilio.com
    description: Connection Policy for sending traffic to your communications infrastructure.
    x-twilio:
      defaultOutputProperties:
      - sid
      - friendly_name
      pathType: list
      dependentProperties:
        targets:
          mapping:
            connection_policy_sid: sid
          resource_url: /v1/ConnectionPolicies/{connection_policy_sid}/Targets
    post:
      description: ''
      tags:
      - ConnectionPolicies
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/voice.v1.connection_policy'
          description: Created
      security:
      - accountSid_authToken: []
      operationId: CreateConnectionPolicy
      x-maturity:
      - GA
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateConnectionPolicyRequest'
    get:
      description: ''
      tags:
      - ConnectionPolicies
      parameters:
      - name: PageSize
        in: query
        description: How many resources to return in each list page. The default is 50, and the maximum is 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      - name: Page
        in: query
        description: The page index. This value is simply for client state.
        schema:
          type: integer
          minimum: 0
      - name: PageToken
        in: query
        description: The page token. This is provided by the API.
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListConnectionPolicyResponse'
          description: OK
      security:
      - accountSid_authToken: []
      operationId: ListConnectionPolicy
      x-maturity:
      - GA
  /v1/ConnectionPolicies/{Sid}:
    servers:
    - url: https://voice.twilio.com
    description: Connection Policy for sending traffic to your communications infrastructure.
    x-twilio:
      defaultOutputProperties:
      - sid
