openapi: 3.2.0
info:
  title: Twilio Conversational Intelligence Operator Results API
  description: The Conversational Intelligence API includes resources to create and manage intelligence configurations, define and run language operators, and retrieve processed conversations and operator results.
  termsOfService: https://www.twilio.com/legal/tos
  contact:
    name: Twilio Support
    url: https://support.twilio.com
    email: support@twilio.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: v3
  x-twilio:
    apiStandards: v1.0
servers:
- url: https://intelligence.twilio.com
  description: Twilio Intelligence API
security:
- basic_apikey_or_accountsid: []
tags:
- name: OperatorResults
  description: 'Retrieve results produced by language operators after they run on conversations,

    including associated execution metadata generated at runtime. Use these results to support real-time agent augmentation, workflow automation, and aggregate conversational insights.


    Results are generated when Conversations are processed by intelligence configuration rules and can be

    queried independently of the original conversation lifecycle.'
paths:
  /v3/OperatorResults:
    x-twilio:
      pathType: list
    get:
      tags:
      - OperatorResults
      security:
      - basic_apikey_or_accountsid: []
      summary: Retrieve a list of OperatorResults
      operationId: ListOperatorResults
      parameters:
      - name: conversationId
        in: query
        required: false
        schema:
          type: string
          pattern: ^conv_conversation_[0-7][0-9a-z]{25}$
          description: The `id` of the Conversation attached to the Operator Result.
          example: conv_conversation_01k1etk2y5f1y9fpe2epfdtvv2
        description: Filter Operator Results by attached Conversation `id`.
      - name: intelligenceConfigurationId
        in: query
        required: false
        schema:
          type: string
          pattern: ^intelligence_configuration_[0-7][0-9a-z]{25}$
          description: Unique identifier for a Intelligence Configuration that generated the Operator Result. Assigned by Twilio (TTID).
          example: intelligence_configuration_01k6fc25s7epm9qtk8rszbv3q5
        description: Filter Operator Results by Intelligence Configuration `id` used to generate them.
      - name: operatorId
        in: query
        required: false
        schema:
          type: string
          readOnly: true
          pattern: ^intelligence_operator_[0-7][0-9a-z]{25}$
          description: The unique identifier for the Language Operator. Assigned by Twilio (TTID).
          example: intelligence_operator_01k6fc25s7epm9qtk8rszbv3q5
        description: Filter Operator Results by Language Operator `id`.
      - name: pageSize
        in: query
        description: The maximum number of resources to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - name: pageToken
        in: query
        description: Token for pagination
        required: false
        schema:
          type: string
      responses:
        '200':
          description: An array of Operator Results.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - meta
                properties:
                  items:
                    type: array
                    description: List of Operator Results matching the query.
                    items:
                      $ref: '#/components/schemas/OperatorResultsResponseV1'
                  meta:
                    type: object
                    properties:
                      key:
                        description: A key, sibling to the `meta` object that holds the actual list of resources
                        type: string
                      pageSize:
                        description: The actual number of resources returned in the response
                        type: integer
                      previousToken:
                        type: string
                      nextToken:
                        type: string
                    required:
                    - key
                    - pageSize
              examples:
                operatorResultList:
                  $ref: '#/components/examples/OperatorResultListExample'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
                  message:
                    description: A human readable error message
                    type: string
                  httpStatusCode:
                    description: HTTP response status code
                    type: integer
                    format: int32
                  userError:
                    description: Whether the error is a user error (true) or a system error (false)
                    type: boolean
                  params:
                    description: A map of parameters related to the error, for example, a `params.twilioErrorCodeUrl` might hold a URL or link to additional information
                    type: object
                    additionalProperties:
                      type: string
                required:
                - code
                - message
                - httpStatusCode
        '429':
          description: Too Many requests (rate limit exceeded for request originating from public API)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
                  message:
                    description: A human readable error message
                    type: string
                  httpStatusCode:
                    description: HTTP response status code
                    type: integer
                    format: int32
                  userError:
                    description: Whether the error is a user error (true) or a system error (false)
                    type: boolean
                  params:
                    description: A map of parameters related to the error, for example, a `params.twilioErrorCodeUrl` might hold a URL or link to additional information
                    type: object
                    additionalProperties:
                      type: string
                required:
                - code
                - message
                - httpStatusCode
          headers:
            X-RateLimit-Limit:
              schema:
                type: string
            X-RateLimit-Remaining:
              schema:
                type: string
            X-RateLimit-Reset:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
                  message:
                    description: A human readable error message
                    type: string
                  httpStatusCode:
                    description: HTTP response status code
                    type: integer
                    format: int32
                  userError:
                    description: Whether the error is a user error (true) or a system error (false)
                    type: boolean
                  params:
                    description: A map of parameters related to the error, for example, a `params.twilioErrorCodeUrl` might hold a URL or link to additional information
                    type: object
                    additionalProperties:
                      type: string
                required:
                - code
                - message
                - httpStatusCode
  /v3/OperatorResults/{operatorResultId}:
    x-twilio:
      pathType: instance
    parameters:
    - name: operatorResultId
      in: path
      required: true
      description: Operator Result id (TTID)
      schema:
        type: string
        pattern: ^intelligence_operatorresult_[0-7][0-9a-z]{25}$
        description: A unique identifier for the Operator Result. Assigned by Twilio (TTID).
        example: intelligence_operatorresult_01k6fc25s7epm9qtk8rszbv3q5
    get:
      tags:
      - OperatorResults
      security:
      - basic_apikey_or_accountsid: []
      summary: Retrieve an OperatorResult
      operationId: FetchOperatorResult
      responses:
        '200':
          description: Operator Result object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorResultsResponseV1'
              examples:
