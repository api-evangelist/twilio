components:
  schemas:
    ExtractionResult:
      title: Extraction result
      type: object
      properties:
        outputFormat:
          $ref: '#/components/schemas/OutputFormat'
        id:
          type: string
          pattern: ^intelligence_operatorresult_[0-7][0-9a-z]{25}$
          description: A unique identifier for the Operator Result. Assigned by Twilio (TTID).
          example: intelligence_operatorresult_01k6fc25s7epm9qtk8rszbv3q5
        accountId:
          type: string
          description: The ID of the Account that created the Language Operator.
          pattern: ^AC[a-zA-Z0-9]{32}$
        intelligenceConfiguration:
          $ref: '#/components/schemas/IntelligenceConfigurationReference'
        conversationId:
          type: string
          pattern: ^conv_conversation_[0-7][0-9a-z]{25}$
          description: The `id` of the Conversation attached to the Operator Result.
          example: conv_conversation_01k1etk2y5f1y9fpe2epfdtvv2
        operator:
          $ref: '#/components/schemas/OperatorReference'
        dateCreated:
          type: string
          format: date-time
          description: Timestamp for when the Operator Result was created.
        referenceIds:
          type: array
          description: The `id`s of objects related to this Operator Result.
          items:
            type: string
            example: CA0fd5fb62ac7e24ce24f071041847aa92
            maxLength: 97
        executionDetails:
          $ref: '#/components/schemas/ExecutionDetails'
        metadata:
          type: object
          properties:
            system:
              $ref: '#/components/schemas/SystemMetaData'
          required:
          - system
        result:
          type: object
          description: The actual result from executing the Language Operator with `EXTRACTION` output format.
          required:
          - entities
          properties:
            entities:
              type: array
              description: List of extracted entities from the Conversation.
              items:
                type: object
                required:
                - text
                - label
                properties:
                  text:
                    type: string
                    description: The actual text of the extracted entity as it appears in the Conversation.
                  label:
                    type: string
                    description: The label for the extracted entity (e.g., `PERSON`, `LOCATION`).
      required:
      - accountId
      - executionDetails
      - id
      - result
      - operator
      - metadata
      - dateCreated
      - intelligenceConfiguration
      - referenceIds
      - conversationId
      - outputFormat
    ExecutionDetails:
      type: object
      description: Details about the conditions under which the Operator executed.
      properties:
        trigger:
          type: object
          description: Metadata for the trigger that generated this Operator Result.
          required:
          - 'on'
          - timestamp
          properties:
            'on':
              type: string
              description: 'The conversational lifecycle event that activated execution of the Rule. Available values are:

                - `COMMUNICATION`: Trigger the Rule on each communication within the Conversation.

                - `CONVERSATION_END`: Trigger the Rule when the Conversation moves to the `closed` state.

                - `CONVERSATION_INACTIVE`: Trigger the Rule when the Conversation moves to the `inactive` state.

                '
            timestamp:
              type: string
              format: date-time
              description: Timestamp of when the trigger was activated.
        communications:
          type: object
          description: Range of first and last communications in the Conversation that were processed during this Operator execution.
          required:
          - first
          - last
          properties:
            first:
              allOf:
              - type: string
                pattern: ^conv_communication_[0-7][0-9a-z]{25}$
                description: Communication `id` from the attached Conversation.
                example: conv_communication_01k1etk2y5f1y9fpe2epfdtvv2
              - description: Starting communication `id` from the attached Conversation.
            last:
              allOf:
              - type: string
                pattern: ^conv_communication_[0-7][0-9a-z]{25}$
                description: Communication `id` from the attached Conversation.
                example: conv_communication_01k1etk2y5f1y9fpe2epfdtvv2
              - description: Ending communication `id` from the attached Conversation.
        channels:
          type: array
          description: Communication channels included in the Conversation when this Operator was executed.
          items:
            type: string
        participants:
          type: array
          description: Metadata for the participants included in the Conversation when this Operator executed.
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: string
                pattern: ^conv_participant_[0-7][0-9a-z]{25}$
                description: The `id` of the Participant in the Conversation.
                example: conv_participant_01k1etx3jbfx88476ccja0889c
              profileId:
                type: string
                pattern: ^mem_profile_[0-7][0-9a-z]{25}$
                description: Customer Memory Profile identifier
                example: mem_profile_00000000000000000000000000
              type:
                type: string
                description: 'Type of participant in the conversation. Available types:

                  - `CUSTOMER`

                  - `HUMAN_AGENT`

                  - `AI_AGENT`

                  - `AGENT`

                  - `UNKNOWN`

                  '
        resolvedContext:
          $ref: '#/components/schemas/ResolvedContext'
      required:
      - trigger
      - communications
      - channels
      - participants
    OperatorReference:
      type: object
      description: Reference to the Language Operator that generated the Operator Result.
      required:
      - id
      - version
      - parameters
      properties:
        id:
          type: string
          description: The `id` of the Language Operator.
        version:
          type: integer
          description: Version of the Language Operator used to generate the Operator Result.
        parameters:
          type: object
          description: Parameter values used for Operator execution, provided by the Rule at runtime. This object contains a dictionary of parameter keys and their corresponding values.
          additionalProperties: true
    SystemMetaData:
      type: object
      required:
      - latencyMs
      - inputCharacters
      - outputCharacters
      - inputTruncated
      properties:
        resolvedModel:
          type: string
          description: The underlying LLM model used for this execution.
          example: gpt-4.1-nano-2025-04-14
        latencyMs:
          type: integer
          description: Operator execution time in milliseconds.
        inputCharacters:
          type: integer
          description: Number of characters in the input sent to the model. Aligns with the billing unit.
        outputCharacters:
          type: integer
          description: Number of characters in the model's response. Aligns with the billing unit.
        inputTruncated:
          type: boolean
          description: Whether the conversation input was truncated to fit the model's context window.
    ResolvedContext:
      type: object
      description: The context that was actually used by the operator during execution
      properties:
        memory:
          type: object
          description: 'The customer profile that was accessed. null if no memory was accessed.


            Either observations and/or traits from the profile were used by the LLM to generate the result.

            '
          required:
          - profileId
          - memoryStoreId
          properties:
            profileId:
              type: string
              pattern: ^mem_profile_[0-7][0-9a-z]{25}$
              description: Customer Memory Profile identifier
              example: mem_profile_00000000000000000000000000
            memoryStoreId:
              type: string
              description: Customer Memory store identifier
              pattern: ^mem_(store|service)_[0-7][0-9a-z]{25}$
              example: mem_store_00000000000000000000000000
        knowledge:
          type:
          - object
          - 'null'
          description: 'Knowledge source IDs with their respective knowledge base ID that was accessed and used by the LLM to generate the result.


            null if no knowledge was accessed.

            '
          required:
          - sources
          properties:
            sources:
              type: array
              items:
                type: object
                required:
                - baseId
                - sourceId
                properties:
                  baseId:
                    type: string
                    description: Knowledge base identifier
                    pattern: ^know_knowledgebase_[0-7][0-9a-z]{25}$
                    example: know_knowledgebase_00000000000000000000000000
                  sourceId:
                    type: string
                    description: Knowledge source identifier
                    pattern: ^know_knowledge_[0-7][0-9a-z]{25}$
                    example: know_knowledge_00000000000000000000000000
    TextResult:
      title: Text result
      type: object
      properties:
        outputFormat:
          $ref: '#/components/schemas/OutputFormat'
        id:
          type: string
          pattern: ^intelligence_operatorresult_[0-7][0-9a-z]{25}$
          description: A unique identifier for the Operator Result. Assigned by Twilio (TTID).
          example: intelligence_operatorresult_01k6fc25s7epm9qtk8rszbv3q5
        accountId:
          type: string
          description: The ID of the Account that created the Language Operator.
          pattern: ^AC[a-zA-Z0-9]{32}$
        intelligenceConfiguration:
          $ref: '#/components/schemas/IntelligenceConfigurationReference'
        conversationId:
          type: string
          pattern: ^conv_conversation_[0-7][0-9a-z]{25}$
          description: The `id` of the Conversation attached to the Operator Result.
          example: conv_conversation_01k1etk2y5f1y9fpe2epfdtvv2
        operator:
          $ref: '#/components/schemas/OperatorReference'
        dateCreated:
          type: string
          format: date-time
          description: Timestamp for when the Operator Result was created.
        referenceIds:
          type: array
          description: The `id`s of objects related to this Operator Result.
          items:
            type: string
            example: CA0fd5fb62ac7e24ce24f071041847aa92
            maxLength: 97
        executionDetails:
          $ref: '#/components/schemas/ExecutionDetails'
        metadata:
          type: object
          properties:
            system:
              $ref: '#/components/schemas/SystemMetaData'
          required:
          - system
        result:
          type: object
          description: The actual result from executing the Language Operator with `TEXT` output format.
          required:
          - text
          properties:
            text:
              type: string
              description: The plaintext result produced by the Language Operator.
      required:
      - accountId
      - executionDetails
      - id
      - result
      - operator
      - metadata
      - dateCreated
      - intelligenceConfiguration
      - referenceIds
      - conversationId
      - outputFormat
    OutputFormat:
      type: string
      title: Output Format
      description: The output format set on the Operator that generated this result. Determines the structure of the `result` object.
      pattern: ^(CLASSIFICATION|TEXT|EXTRACTION|JSON)$
    IntelligenceConfigurationReference:
      type: object
      description: Reference to the Intelligence Configuration that generated the Operator Result.
      required:
      - id
      - ruleId
      - version
      properties:
        id:
          type: string
          pattern: ^intelligence_configuration_[0-7][0-9a-z]{25}$
          description: Unique identifier for a Intelligence Configuration that generated the Operator Result. Assigned by Twilio (TTID).
          example: intelligence_configuration_01k6fc25s7epm9qtk8rszbv3q5
        ruleId:
          type: string
          pattern: ^intelligence_configurationrule_[0-7][0-9a-z]{25}$
          description: Unique identifier of the rule of the Intelligence Configuration that triggered the result. Assigned by Twilio (TTID).
          example: intelligence_configurationrule_01k6fc25s7epm9qtk8rszbv3q6
        version:
          type: integer
          description: Version of the Intelligence Configuration used to generate the Operator Result.
    OperatorResultsResponseV1:
      type: object
      title: Operator Results Response V1
      properties:
        outputFormat:
          $ref: '#/components/schemas/OutputFormat'
      discriminator:
        propertyName: outputFormat
        mapping:
          TEXT: '#/components/schemas/TextResult'
          JSON: '#/components/schemas/JSONResult'
          CLASSIFICATION: '#/components/schemas/ClassificationResult'
          EXTRACTION: '#/components/schemas/ExtractionResult'
      oneOf:
      - $ref: '#/components/schemas/TextResult'
      - $ref: '#/components/schemas/JSONResult'
      - $ref: '#/components/schemas/ClassificationResult'
      - $ref: '#/components/schemas/ExtractionResult'
    JSONResult:
      title: JSON result
      type: object
      properties:
        outputFormat:
          $ref: '#/components/schemas/OutputFormat'
        id:
          type: string
          pattern: ^intelligence_operatorresult_[0-7][0-9a-z]{25}$
          description: A unique identifier for the Operator Result. Assigned by Twilio (TTID).
          example: intelligence_operatorresult_01k6fc25s7epm9qtk8rszbv3q5
        accountId:
          type: string
          description: The ID of the Account that created the Language Operator.
          pattern: ^AC[a-zA-Z0-9]{32}$
        intelligenceConfiguration:
          $ref: '#/components/schemas/IntelligenceConfigurationReference'
        conversationId:
          type: string
          pattern: ^conv_conversation_[0-7][0-9a-z]{25}$
          description: The `id` of the Conversation attached to the Operator Result.
          example: conv_conversation_01k1etk2y5f1y9fpe2epfdtvv2
        operator:
          $ref: '#/components/schemas/OperatorReference'
        dateCreated:
          type: string
          format: date-time
          description: Timestamp for when the Operator Result was created.
        referenceIds:
          type: array
          description: The `id`s of objects related to this Operator Result.
          items:
            type: string
            example: CA0fd5fb62ac7e24ce24f071041847aa92
            maxLength: 97
        executionDetails:
          $ref: '#/components/schemas/ExecutionDetails'
        metadata:
          type: object
          properties:
            system:
              $ref: '#/components/schemas/SystemMetaData'
          required:
          - system
        result:
          type: object
          description: The actual result from executing the Language Operator with `JSON` output format. Its structure depends on the `outputSchema` defined on the Operator.
          additionalProperties: true
      required:
      - accountId
      - executionDetails
      - id
      - result
      - operator
      - metadata
      - dateCreated
      - intelligenceConfiguration
      - referenceIds
      - conversationId
      - outputFormat
    ClassificationResult:
      title: Classification result
      type: object
      properties:
        outputFormat:
          $ref: '#/components/schemas/OutputFormat'
        id:
          type: string
          pattern: ^intelligence_operatorresult_[0-7][0-9a-z]{25}$
          description: A unique identifier for the Operator Result. Assigned by Twilio (TTID).
          example: intelligence_operatorresult_01k6fc25s7epm9qtk8rszbv3q5
        accountId:
          type: string
