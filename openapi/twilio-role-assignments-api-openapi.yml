components:
  schemas:
    TwilioServiceErrorResponse:
      type: object
      properties:
        code:
          description: Twilio-specific error code
          type: integer
          format: int32
        message:
          description: Error message
          type: string
        moreInfo:
          description: Link to Error Code References
          type: string
        status:
          description: HTTP response status code
          type: integer
          format: int32
    PublicApiCreateRoleAssignmentResponsePage:
      type: object
      properties:
        content:
          type: array
          description: Page content
          items:
            $ref: '#/components/schemas/PublicApiRoleAssignmentResponse'
        meta:
          properties:
            first_page_url:
              format: uri
              type: string
            key:
              type: string
            next_page_url:
              format: uri
              type:
              - string
              - 'null'
            page:
              type: integer
            page_size:
              type: integer
            previous_page_url:
              format: uri
              type:
              - string
              - 'null'
            url:
              format: uri
              type: string
          type: object
    PublicApiRoleAssignmentResponse:
      type: object
      properties:
        sid:
          pattern: IY[0-9a-f]{32}
          type: string
          description: Twilio Role Assignment Sid representing this role assignment
          format: IamRoleAssignmentSid
          example: IYc4ddb9d0befdb122b0eff334e3084544
        role_sid:
          pattern: IX[0-9a-f]{32}
          type: string
          description: Twilio Role Sid representing assigned role
          format: IamRoleSid
          example: IXc4ddb9d0befdb122b0eff334e3084544
        scope:
          pattern: ^[A-Z]{2}[0-9a-fA-F]{32}$
          type: string
          description: Twilio Sid representing identity of this assignment
          format: Sid
          example: REDACTED_TWILIO_ACCOUNT_SID
        identity:
          pattern: ^[A-Z]{2}[0-9a-fA-F]{32}$
          type: string
          description: Twilio Sid representing scope of this assignment
          format: Sid
          example: USc4ddb9d0befdb122b0eff334e3084544
        resource_type:
          type:
          - string
          - 'null'
          description: The resource type for resource-level role assignments
        resource_id:
          type:
          - string
          - 'null'
          description: The resource id for resource-level role assignments
    PublicApiCreateRoleAssignmentRequest:
      required:
      - role_sid
      - scope
      - identity
      type: object
      properties:
        role_sid:
          pattern: IX[0-9a-f]{32}
          type: string
          description: Twilio Role Sid representing assigned role
          format: IamRoleSid
          example: IXc4ddb9d0befdb122b0eff334e3084544
        scope:
          pattern: ^[A-Z]{2}[0-9a-fA-F]{32}$
          type: string
          description: Twilio Sid representing scope of this assignment
          format: Sid
          example: REDACTED_TWILIO_ACCOUNT_SID
        identity:
          pattern: ^[A-Z]{2}[0-9a-fA-F]{32}$
          type: string
          description: Twilio Sid representing identity of this assignment
          format: Sid
          example: USc4ddb9d0befdb122b0eff334e3084544
        resource_type:
          type:
          - string
          - 'null'
          description: The resource type for resource-level role assignments
        resource_id:
          type:
          - string
          - 'null'
          description: The resource id for resource-level role assignments
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://preview-iam.twilio.com/v1/token
          scopes: {}
