paths:
  /Organizations/{OrganizationSid}/RoleAssignments:
    servers:
    - url: https://preview-iam.twilio.com
    get:
      tags:
      - Role Assignments
      summary: List role assignments
      description: List role assignments for the given organization
      operationId: ListRoleAssignments
      parameters:
      - name: OrganizationSid
        in: path
        required: true
        schema:
          pattern: OR[0-9a-f]{32}
          type: string
          format: OrganizationSid
          example: OR33f4f3aa6fffe840d000f8ef22e883db
      - name: PageSize
        in: query
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 100
      - name: PageToken
        in: query
        schema:
          maxLength: 4096
          minLength: 1
          type: string
      - name: Identity
        in: query
        required: false
        schema:
          pattern: ^[A-Z]{2}[0-9a-fA-F]{32}$
          type: string
          format: Sid
          example: USa36de9717566c7eb6363671f54b87ba9
      - name: Scope
        in: query
        required: false
        schema:
          pattern: ^[A-Z]{2}[0-9a-fA-F]{32}$
          type: string
          format: Sid
          example: REDACTED_TWILIO_ACCOUNT_SID
      - name: ResourceType
        in: query
        required: false
        description: Filter by resource type for resource-level role assignments
        schema:
          type: string
      - name: ResourceId
        in: query
        required: false
        description: Filter by resource id for resource-level role assignments
        schema:
          type: string
      responses:
        '200':
          description: Returned list of role assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApiCreateRoleAssignmentResponsePage'
          headers:
            Access-Control-Allow-Origin:
              description: Specify the origin(s) allowed to access the resource
              schema:
                type: string
              example: '*'
            Access-Control-Allow-Methods:
              description: Specify the HTTP methods allowed when accessing the resource
              schema:
                type: string
              example: POST, OPTIONS
            Access-Control-Allow-Headers:
              description: Specify the headers allowed when accessing the resource
              schema:
                type: string
              example: Content-Type, Authorization
            Access-Control-Allow-Credentials:
              description: Indicates whether the browser should include credentials
              schema:
                type: boolean
            Access-Control-Expose-Headers:
              description: Headers exposed to the client
              schema:
                type: string
                example: X-Custom-Header1, X-Custom-Header2
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Twilio-specific error code
                    type: integer
                    format: int32
                  message:
                    description: Error message
                    type: string
                  more_info:
                    description: Link to Error Code References
                    type: string
                  status:
                    description: HTTP response status code
                    type: integer
