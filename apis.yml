- aid: twilio:twilio-identityresolutionsettings-api
  name: Twilio Identity Resolution Settings API
  description: >-
    The Identity Resolution Settings endpoints allow you to define and manage the logic used to identify,
    merge, and resolve customer profiles within a specific Memory Store. These settings ensure that incoming
    data is accurately attributed to the correct individual across different communication channels.


    Through these configurations, you can define specific identifiers like email or phone numbers and
    apply normalization to ensure data consistency. Each identifier uses an exact matching algorithm and
    is set to enforce uniqueness, which automatically triggers a profile merge if a duplicate is found.


    You can also manage data storage by setting a limit on the number of values retained per identifier,
    with a `first-in-first-out (FIFO)` or `last-in-first-out (LIFO)` policy to remove the oldest entries
    upon crossing the set limit.


    Finally, a prioritized list of matching rules determines if an incoming interaction should create
    a new profile, update a single record, or consolidate multiple existing profiles into one.
  humanURL: https://www.twilio.com/docs/iam/api/account
  baseURL: https://messaging.twilio.com
