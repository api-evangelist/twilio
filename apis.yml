- aid: twilio:twilio-profile-api
  name: Twilio Profile API
  description: >-
    Profiles are the canonical customer records in a Memory Store. Each profile holds traits, organized
    into trait groups, that identify and describe a customer and let Twilio attach future conversation
    data to the right person. Every profile is scoped to a single Memory Store, so profile resolution,
    trait updates, and imports all happen within that store.


    Conversation Memory passively hydrates profiles from your existing Twilio SMS channels via Conversation
    Orchestrator. Conversations formed by Conversation Orchestrator create profiles in the store, and
    automatically enrich profiles with observations and conversation summaries.


    The Profiles API gives you two main ways to work with profile data. You can manage profiles one at
    a time with create, read, update, and delete endpoints, or you can load them at scale with bulk upserts
    and CSV imports. Which path you choose depends on whether you are handling live application traffic
    or backfilling data from an existing system.
