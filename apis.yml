- aid: twilio:twilio-conversationsummaries-api
  name: Twilio Conversation Summaries API
  description: >-
    Conversation summaries are high-level recaps automatically generated from conversations that run through
    Conversation Orchestrator. Like observations, they are created when a conversation reaches the configured
    `Closed` state and are written back to the customer's profile.


    Summaries focus on the overall conversation, such as the main topics discussed, the outcome, and the
    broader context of the interaction. They are less focused on specific customer preferences or durable
    user details, which is what observations are meant to capture.


    Over time, new conversations add new summaries to the profile, giving agents a quick way to understand
    past interactions without reading every transcript.
  humanURL: https://www.twilio.com/docs/iam/api/account
  baseURL: https://messaging.twilio.com
