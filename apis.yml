- aid: twilio:twilio-identifiers-api
  name: Twilio Identifiers API
  description: >-
    Every customer interaction must be attached to the correct profile. Conversation Memory manages this
    through Identifiers which are normalized, unique values like phone numbers or email addresses. When
    a new interaction arrives, Twilio uses these identifiers to search for an existing profile. A successful
    match attaches the interaction to that profile's history, while a failed match triggers the creation
    of a new profile.


    Identifiers are derived from traits. The `idTypePromotion` field on a trait maps its value to a configured
    identifier type, such as `email` or `phone`, as defined in the store's Identity Resolution Settings.
    Once mapped, the trait value becomes a searchable key. If no profile is found, Twilio creates a new
    profile and records the value as both a trait and an identifier.
  humanURL: https://www.twilio.com/docs/iam/api/account
  baseURL: https://messaging.twilio.com
  tags:
  - Identifiers
