- aid: twilio:twilio-retrieval-api
  name: Twilio Retrieval API
  description: >-
    The Retrieval APIs resolve profiles and return relevant memory at the moment an agent needs them.
    Profile lookup is leveraged by the Conversation Orchestrator. When an inbound message arrives on a
    configured channel, Twilio resolves the sender's identity and either attaches the conversation to
    an existing profile or creates a new one if no match is found. The Lookup Profiles endpoint also supports
    direct lookup by identifier, applying the store's identity resolution rules and normalized values.


    For memory retrieval, the Recall endpoint uses hybrid semantic and lexical search to return only the
    most relevant observations and summaries, minimizing token usage by avoiding transmission of the full
    profile history into the prompt. When a `conversationId` is provided without a query, Twilio derives
    a query from the conversation context and applies it to search the profile store.
