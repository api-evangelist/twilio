method: searched
name: Twilio API rate limits
source: https://www.twilio.com/docs/verify/api/rate-limits-and-timeouts
sources:
- https://www.twilio.com/docs/verify/api/rate-limits-and-timeouts
- https://www.twilio.com/docs/usage/rest-api-best-practices
- https://www.twilio.com/docs/verify/api/safe-list
- https://www.twilio.com/docs/sendgrid/api-reference/how-to-use-the-sendgrid-v3-api/rate-limits
published: true
note: Twilio publishes rate limits per product rather than one platform-wide table. The rows under limits[] are the
  numeric limits on the source page (Verify status-check limits); other_documented_limits[] carries limits quoted from
  other product pages, each with its own page URL. The core REST API enforces per-account concurrency limits whose
  numbers are not published; exhaustion is signalled with 429 and the Twilio-Concurrent-Requests header.
limit_count: 3
limits:
